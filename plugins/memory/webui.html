<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🧠 hpptools-memory 控制台</title>
<style>
  :root {
    --bg: #14161a; --panel: #1c1f26; --panel2: #232733; --border: #2e3440;
    --text: #d8dee9; --dim: #8b93a5; --accent: #5e81ac; --ok: #4caf7d; --warn: #d9a45b; --err: #c9685f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.6 system-ui, "Segoe UI", sans-serif; padding: 24px; max-width: 980px; margin: 0 auto; }
  h1 { font-size: 20px; display: flex; align-items: center; gap: 8px; }
  header { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 8px; }
  header .root { color: var(--dim); font-size: 12px; font-family: ui-monospace, monospace; }
  .migrated { background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 14px; font-size: 13px; color: var(--warn); margin-bottom: 14px; }
  nav { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
  nav button { background: none; border: none; color: var(--dim); font-size: 14px; padding: 8px 16px; cursor: pointer; border-bottom: 2px solid transparent; }
  nav button.active { color: var(--text); border-bottom-color: var(--accent); }
  section[hidden] { display: none; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .card .k { color: var(--dim); font-size: 12px; margin-bottom: 4px; }
  .card .v { font-size: 18px; font-weight: 600; }
  .card .s { font-size: 12px; color: var(--dim); margin-top: 2px; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; }
  .badge.ok { background: rgba(76,175,125,.15); color: var(--ok); }
  .badge.bad { background: rgba(201,104,95,.15); color: var(--err); }
  .badge.run { background: rgba(217,164,91,.15); color: var(--warn); }
  .row { display: flex; gap: 12px; align-items: center; margin: 14px 0; flex-wrap: wrap; }
  label { color: var(--dim); font-size: 13px; min-width: 90px; }
  select, button { background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 7px 12px; font-size: 13px; }
  select:focus { outline: 1px solid var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; cursor: pointer; }
  button:hover { filter: brightness(1.15); }
  .hint { color: var(--dim); font-size: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--dim); font-weight: 500; font-size: 12px; }
  tr.run-row { cursor: pointer; }
  tr.run-row:hover { background: var(--panel2); }
  tr.run-row.active { background: var(--panel2); outline: 1px solid var(--accent); }
  .log { background: #101216; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-family: ui-monospace, monospace; font-size: 12px; white-space: pre-wrap; max-height: 320px; overflow: auto; margin-top: 12px; color: var(--dim); }
  .error-banner { background: rgba(201,104,95,.12); border: 1px solid var(--err); color: var(--err); border-radius: 8px; padding: 8px 14px; margin-bottom: 14px; display: none; }
  .spacer { flex: 1; }
</style>
</head>
<body>
<header>
  <h1>🧠 hpptools-memory 控制台</h1>
  <span class="root" id="rootPath"></span>
</header>
<div class="error-banner" id="errBanner"></div>
<div class="migrated" id="migrated" hidden></div>

<nav>
  <button data-tab="overview" class="active">概览</button>
  <button data-tab="models">模型配置</button>
  <button data-tab="runs">子代理运行</button>
</nav>

<section id="tab-overview">
  <div class="cards" id="cards"></div>
</section>

<section id="tab-models" hidden>
  <div class="row"><label>固化子代理模型</label><select id="modelExtractor" style="min-width:260px"></select><span class="hint">每 5 轮自动沉淀长期记忆的子代理</span></div>
  <div class="row"><label>海马体模型</label><select id="modelCleaner" style="min-width:260px"></select><span class="hint">手动 / 手动触发记忆整理的子代理</span></div>
  <div class="row">
    <button class="primary" id="saveModels">保存模型配置</button>
    <span class="hint" id="saveResult"></span>
  </div>
  <div class="hint" style="margin-top:8px">选项来自 DeepSeek Harness 已配置的模型（设置 → 模型）。选择 "(default)" 则使用当前会话的默认模型。</div>
</section>

<section id="tab-runs" hidden>
  <div class="row">
    <span class="hint" id="runsHint">加载中…</span>
    <span class="spacer"></span>
    <button id="btnClean">🧹 运行记忆清理（海马体）</button>
  </div>
  <table>
    <thead><tr><th>开始时间</th><th>类型</th><th>状态</th><th>持续</th><th>终态原因</th></tr></thead>
    <tbody id="runsBody"></tbody>
  </table>
  <div class="log" id="runLog" hidden></div>
</section>

<script>
"use strict";
const API = {
  overview: "/hpptools-memory/api/overview",
  models:   "/hpptools-memory/api/models",
  runs:     "/hpptools-memory/api/runs",
  model:    "/hpptools-memory/api/model",
  clean:    "/hpptools-memory/api/clean",
};
const $ = (id) => document.getElementById(id);
let selectedRunId = null;
let modelsCache = null;

async function fetchJson(url, options) {
  const res = await fetch(url, options);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ("HTTP " + res.status));
  return data;
}

function fmtTime(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  return d.toLocaleString("zh-CN", { hour12: false });
}
function fmtDur(startIso, endIso) {
  const s = new Date(startIso).getTime();
  const e = endIso ? new Date(endIso).getTime() : Date.now();
  const sec = Math.max(0, Math.round((e - s) / 1000));
  if (sec < 60) return sec + "s";
  const m = Math.floor(sec / 60);
  return m + "m" + (sec % 60) + "s";
}
function badge(ok) { return ok ? '<span class="badge ok">✅</span>' : '<span class="badge bad">❌</span>'; }

// ---------------------------------------------------------------- tabs
document.querySelectorAll("nav button").forEach((b) => {
  b.addEventListener("click", () => {
    document.querySelectorAll("nav button").forEach((x) => x.classList.remove("active"));
    b.classList.add("active");
    for (const s of ["overview", "models", "runs"]) $("tab-" + s).hidden = s !== b.dataset.tab;
    if (b.dataset.tab === "models") loadModels();
    if (b.dataset.tab === "runs") loadRuns();
  });
});

// ---------------------------------------------------------------- overview
function card(k, v, s) {
  return '<div class="card"><div class="k">' + k + '</div><div class="v">' + v + '</div>' + (s ? '<div class="s">' + s + "</div>" : "") + "</div>";
}
async function loadOverview() {
  try {
    const d = await fetchJson(API.overview);
    $("rootPath").textContent = "存储根: " + d.root;
    if (d.migrated) {
      $("migrated").hidden = false;
      $("migrated").textContent = "🔄 已从 Pi agent 迁移记忆（来源 " + d.migrated.from + "，" + d.migrated.copiedItems + " 项，" + fmtTime(d.migrated.at) + "）。Pi 的数据保持原样。";
    }
    const pm = d.projectMem ? d.projectMem.files + " 文件 / " + d.projectMem.entries + " 条" + (d.projectMem.skillFiles ? " + " + d.projectMem.skillFiles + " 技能" : "") : "无活动会话";
    const gm = d.globalMem.files + " 文件 / " + d.globalMem.entries + " 条" + (d.globalMem.skillFiles ? " + " + d.globalMem.skillFiles + " 技能" : "");
    const lm = d.lastMaintenance ? fmtTime(d.lastMaintenance.lastRun) + (d.lastMaintenance.project ? "（" + d.lastMaintenance.project + "）" : "") : "从未整理";
    $("cards").innerHTML =
      card("核心提示词", badge(d.core), "core-prompt.md") +
      card("行为规则", badge(d.rules), "rules.md") +
      card("会话小本本", badge(d.notebook), "notebook.md") +
      card("项目记忆", pm, d.projectMem ? "memories/（当前项目）" : "打开会话后可见") +
      card("全局记忆", gm, "personal/") +
      card("最近记忆整理", lm, "maintenance/") +
      card("运行中的子代理", d.activeRuns > 0 ? '<span class="badge run">' + d.activeRuns + " 个</span>" : "0 个", "固化 / 海马体") +
      card("固化模型", d.configured.extractor, "extractor") +
      card("海马体模型", d.configured.cleaner, "cleaner");
  } catch (e) {
    $("errBanner").style.display = "block";
    $("errBanner").textContent = "⚠️ " + e.message;
  }
}

// ---------------------------------------------------------------- models
async function loadModels() {
  try {
    const d = await fetchJson(API.models);
    modelsCache = d;
    const opts = (sel, current) => {
      const html = ['<option value="(default)">(default)</option>'];
      for (const p of d.providers) {
        for (const m of p.models) {
          const v = p.id + "/" + m.id;
          html.push('<option value="' + v + '">' + (m.name || m.id) + "（" + p.name + "）</option>");
        }
      }
      if (current && current !== "(default)") html.push('<option value="' + current + '" selected>' + current + "（当前配置）</option>");
      sel.innerHTML = html.join("");
      sel.value = current || "(default)";
    };
    opts($("modelExtractor"), d.configured.extractor);
    opts($("modelCleaner"), d.configured.cleaner);
    $("saveResult").textContent = "已加载 " + d.providers.length + " 个 provider";
  } catch (e) {
    $("errBanner").style.display = "block";
    $("errBanner").textContent = "⚠️ 模型列表加载失败: " + e.message;
  }
}

$("saveModels").addEventListener("click", async () => {
  try {
    const r1 = await fetchJson(API.model, {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ kind: "extractor", value: $("modelExtractor").value }),
    });
    const r2 = await fetchJson(API.model, {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ kind: "cleaner", value: $("modelCleaner").value }),
    });
    $("saveResult").textContent = "✅ 已保存：固化=" + r1.value + "，海马体=" + r2.value;
    loadOverview();
  } catch (e) {
    $("saveResult").textContent = "❌ " + e.message;
  }
});

// ---------------------------------------------------------------- runs
async function loadRuns() {
  try {
    const d = await fetchJson(API.runs);
    const active = d.runs.filter((r) => r.status === "running").length;
    $("runsHint").textContent = "最近 " + d.runs.length + " 次运行，" + active + " 个进行中（每 3 秒刷新）。点击行查看活动日志。";
    $("runsBody").innerHTML = d.runs.map((r) => {
      const badgeHtml = r.status === "running"
        ? '<span class="badge run">⏳ 运行中</span>'
        : r.status === "done" ? '<span class="badge ok">✅ 完成</span>'
        : '<span class="badge bad">❌ ' + (r.status || "失败") + "</span>";
      return '<tr class="run-row' + (r.id === selectedRunId ? " active" : "") + '" data-id="' + r.id + '">' +
        "<td>" + fmtTime(r.startedAt) + "</td>" +
        "<td>" + r.kind + "</td>" +
        "<td>" + badgeHtml + "</td>" +
        "<td>" + fmtDur(r.startedAt, r.endedAt) + "</td>" +
        "<td>" + (r.stopReason || "—") + "</td></tr>";
    }).join("") || '<tr><td colspan="5" style="color:var(--dim)">暂无运行记录</td></tr>';

    document.querySelectorAll("tr.run-row").forEach((tr) => {
      tr.addEventListener("click", () => {
        selectedRunId = tr.dataset.id;
        const run = d.runs.find((r) => r.id === selectedRunId);
        const log = $("runLog");
        if (run && run.log && run.log.length) {
          log.hidden = false;
          log.textContent = run.log.join("\n");
          log.scrollTop = log.scrollHeight;
        } else {
          log.hidden = true;
        }
        document.querySelectorAll("tr.run-row").forEach((x) => x.classList.remove("active"));
        tr.classList.add("active");
      });
    });
  } catch (e) {
    $("runsHint").textContent = "⚠️ " + e.message;
  }
}

$("btnClean").addEventListener("click", async () => {
  $("btnClean").disabled = true;
  try {
    const r = await fetchJson(API.clean, { method: "POST" });
    $("runsHint").textContent = "✅ 海马体已启动（run " + r.runId + "），切到「概览」或稍等查看进度…";
  } catch (e) {
    $("runsHint").textContent = "❌ " + e.message;
  } finally {
    $("btnClean").disabled = false;
  }
});

// ---------------------------------------------------------------- polling
loadOverview();
setInterval(loadOverview, 5000);
setInterval(loadRuns, 3000);
</script>
</body>
</html>
