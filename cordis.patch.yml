# hpptools-memory — 插件行（DeepSeek Harness profile patch）
#
# 安装方式：
#   Windows: scripts/install.ps1
#   Linux/Mac: scripts/install.sh
# 脚本会把 hpptools-memory 以 junction/符号链接装入 <DSH_HOME>/profiles/node_modules，
# 并把下面这段 insert 合并进 <DSH_HOME>/profiles/web/cordis.patch.yml。
#
# config.root：记忆存储根目录（默认复用 ~/.pi/agent/memory，与 Pi Coding Agent 共享数据；
# 换新位置后旧数据不迁移，需自行复制）。
- insert:
    - id: hpptools-memory
      name: 'hpptools-memory'
      config:
        root: '~/.pi/agent/memory'
